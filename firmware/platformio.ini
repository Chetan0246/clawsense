; PlatformIO project configuration for the ClawSense ESP32-S3 node.
;
; Board : ESP32-S3-DevKitC-1
; Framework : Arduino (espressif32 platform)
;
; Flash:  pio run -t upload
; Serial: pio device monitor   (115200 baud)
;
; NOTE: `board_build.flash_mode` is intentionally left at the platform default
; (qio). The DevKitC-1 modules vary (N4/N8/N16 + R2/R8 PSRAM); forcing a flash
; mode here risks bricking the boot on a mismatched module, so we do not set it.

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; USB CDC serial on the S3 (native USB) so `pio device monitor` works.
monitor_speed = 115200

; -DCORE_DEBUG_LEVEL=3 -> INFO and above from the Arduino core.
; Our own logging level is controlled by CONFIG_LOG_LEVEL in config.h.
build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DCONFIG_LOG_LEVEL=3

lib_deps =
    ESP32Servo
    adafruit/DHT sensor library
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit SSD1306
    adafruit/Adafruit GFX Library
    bblanchon/ArduinoJson@^7.0.4

; Keep the watchdog enabled: loop() is written to be fully non-blocking and
; feeds the task watchdog, so an accidental blocking call will be caught.
